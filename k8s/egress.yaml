apiVersion: v1
kind: ServiceAccount
metadata:
  name: ts-egress
  namespace: honeywatch
  labels:
    app: honeywatch-egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ts-egress-state
  namespace: honeywatch
  labels:
    app: honeywatch-egress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-egress-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ts-egress-state
  namespace: honeywatch
  labels:
    app: honeywatch-egress
subjects:
  - kind: ServiceAccount
    name: ts-egress
    namespace: honeywatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ts-egress-state
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeywatch-egress
  namespace: honeywatch
  labels:
    app: honeywatch-egress
spec:
  replicas: 1
  strategy:
    # Single tailnet identity -- don't run two pods racing for the same state.
    type: Recreate
  selector:
    matchLabels:
      app: honeywatch-egress
  template:
    metadata:
      labels:
        app: honeywatch-egress
    spec:
      serviceAccountName: ts-egress
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.80.0
          imagePullPolicy: IfNotPresent
          env:
            # Both values come from the SealedSecret in secret.yaml.
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: honeywatch-egress
                  key: TS_AUTHKEY
            - name: TS_DEST_IP
              valueFrom:
                secretKeyRef:
                  name: honeywatch-egress
                  key: HONEYPOT_TS_IP
            - name: TS_KUBE_SECRET
              value: ts-egress-state
            - name: TS_HOSTNAME
              value: honeywatch-egress
            - name: TS_USERSPACE
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --login-server=https://vpn.codextechnologies.org
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      ip link show tailscale0 >/dev/null 2>&1 && break
                      sleep 1
                    done
                    ip route add 100.64.0.0/10 dev tailscale0 2>/dev/null || true
                    iptables -t nat -C PREROUTING -i eth0 -p tcp --dport 5000 \
                      -j DNAT --to-destination "$TS_DEST_IP:5000" 2>/dev/null \
                      || iptables -t nat -I PREROUTING -i eth0 -p tcp --dport 5000 \
                      -j DNAT --to-destination "$TS_DEST_IP:5000"
                    iptables -t nat -C POSTROUTING -o tailscale0 -j MASQUERADE 2>/dev/null \
                      || iptables -t nat -A POSTROUTING -o tailscale0 -j MASQUERADE
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: honeypot-api
  namespace: honeywatch
  labels:
    app: honeywatch-egress
spec:
  type: ClusterIP
  # Traffic hitting this service is routed to the ts-egress pod, where
  # tailscaled's DNAT (TS_DEST_IP) forwards it across the tailnet to the
  # honeypot VPS's nginx on port 5000.
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app: honeywatch-egress
---
# Pin egress from the tailscale sidecar. Tailscaled needs:
#   - TCP 443+6443+8443 to any IP (DERP relays, k8s API and traefik
#     websecure after DNAT — the headscale control plane is reached by
#     hairpinning into this cluster's own LoadBalancer IP, so the dial
#     to vpn.codextechnologies.org:443 is DNATed to the traefik pod's
#     8443 before this policy is evaluated)
#   - UDP 41641 to any public IP (direct WireGuard)
#   - DNS (UDP/TCP 53) to the cluster resolver
# Everything else is denied so a compromised sidecar cannot pivot into
# the rest of the cluster or the internet at large.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honeywatch-egress-allow
  namespace: honeywatch
  labels:
    app: honeywatch-egress
spec:
  podSelector:
    matchLabels:
      app: honeywatch-egress
  policyTypes:
    - Egress
  egress:
    # DNS to the cluster resolver (kube-dns / coredns in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Tailscale control plane, DERP relays, AND k8s API.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8443
    # Direct WireGuard to peers (UDP 41641 any address) + STUN (UDP 3478).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 41641
        - protocol: UDP
          port: 3478
---
# kube-router applies a namespace-wide default-deny when any Egress
# NetworkPolicy exists. This policy explicitly allows egress for every
# pod that is NOT the locked-down tailscale sidecar, so the dashboard
# (and any future non-egress workload) is not collateral-blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honeywatch-dashboard-netpol
  namespace: honeywatch
  labels:
    app: dashboard
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
    - Egress
  egress:
    # DNS only — nginx serves static files and needs no other egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
