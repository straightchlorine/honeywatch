apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: honeywatch

resources:
  - namespace.yaml
  - dashboard.yaml
  - egress.yaml
  - middleware.yaml
  - ingress.yaml
  - secret.yaml

# Image Updater writes the resolved tag here when a newer dashboard image
# is published. Pinned at build time; kept in sync via the
# argocd-image-updater annotations on the Application.
images:
  - name: ghcr.io/straightchlorine/honeywatch/dashboard
    newTag: latest
