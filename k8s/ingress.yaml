apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeywatch-api
  namespace: honeywatch
  labels:
    app: honeywatch
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    # Ratelimit only; security headers via nginx.conf.
    traefik.ingress.kubernetes.io/router.middlewares: honeywatch-api-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - honey.piotrkrzysztof.dev
      secretName: honeywatch-tls
  rules:
    - host: honey.piotrkrzysztof.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: honeypot-api
                port:
                  number: 5000
---
# No ratelimit; prevents 429 on cold loads (asset parallelism).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeywatch-dashboard
  namespace: honeywatch
  labels:
    app: honeywatch
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: honeywatch-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - honey.piotrkrzysztof.dev
      secretName: honeywatch-tls
  rules:
    - host: honey.piotrkrzysztof.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
