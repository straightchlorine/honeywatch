# ArgoCD Application for honeywatch.
#
# Bootstrap (once per cluster):
#   kubectl apply -f k8s/argocd-app.yaml
# Then ArgoCD auto-syncs from repo; Image Updater watches dashboard image, commits resolved tag to kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: honeywatch
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: dashboard=ghcr.io/straightchlorine/honeywatch/dashboard
    argocd-image-updater.argoproj.io/dashboard.update-strategy: semver
    argocd-image-updater.argoproj.io/dashboard.allow-tags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: master
    argocd-image-updater.argoproj.io/git-commit-user: straightchlorine
    argocd-image-updater.argoproj.io/git-commit-email: 44237356+straightchlorine@users.noreply.github.com
spec:
  project: default
  source:
    repoURL: https://github.com/straightchlorine/honeywatch.git
    path: k8s
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: honeywatch
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
