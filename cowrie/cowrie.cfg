# Honeywatch - Cowrie SSH Honeypot Configuration
# Mimics CentOS Stream 10 with OpenSSH 9.8p1

[honeypot]
hostname = centos
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
share_path = share/cowrie
state_path = var/lib/cowrie
etc_path = etc

sensor_name = edge-01
timezone = Europe/Helsinki
auth_class = UserDB

# Cap malware uploads at 10 MB so cowrie-state cannot be filled unboundedly
download_limit_size = 10485760

# Disabled tty replay
ttylog = false
ttylog_path = var/log/cowrie/tty

[shell]
kernel_name = Linux
kernel_version = 6.12.0-116.el10.x86_64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Fri Aug  1 21:49:19 UTC 2025
hardware_platform = x86_64
operating_system = GNU/Linux

# Return a dummy ELF matching the requested architecture so a mips64 or
# aarch64 wget request does not unmask the honeypot by receiving an x86_64 ELF
arch = linux-x64-lsb,linux-aarch64-lsb,linux-mips-msb,linux-arm-lsb,linux-ppc-msb,linux-sparc-msb

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

# Match CentOS Stream 10 OpenSSH vendor build (distro suffix required)
version = SSH-2.0-OpenSSH_9.8p1 RHEL10

auth_delay = 1.0
auth_delay_jitter = 1.5

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log
