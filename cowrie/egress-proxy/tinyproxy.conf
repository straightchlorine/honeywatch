User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 30

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

LogLevel Warning
LogFile "/dev/stderr"

MaxClients 20
StartServers 2
MinSpareServers 2
MaxSpareServers 5

# Honeypot container network (docker default bridge range). If the
# `honeypot` bridge is ever pinned to a narrower subnet, tighten this.
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# HTTP CONNECT tunnels: only 80 and 443. Blocks SMTP (25/465/587),
# SMB (139/445), Telnet (23), IRC (6660-6669/6697), RDP (3389), VNC
# (5900) and any other exotic C2 channel a payload might try.
ConnectPort 443
ConnectPort 80

# Deny a handful of public relay/paste hosts frequently used as C2
# drops, in addition to the iptables-level DROP default.
Filter "/etc/egress-proxy/filter.txt"
FilterURLs On
FilterDefaultDeny Off
