# NOTE: User/Group not declared here on purpose. Privilege drop is
# performed exactly once at exec time by setpriv in start.sh, with
# `--bounding-set=-all` and `--no-new-privs` so tinyproxy ends up with
# no capabilities anywhere. Keeping User/Group here would be redundant
# and would leave the cap bounding set populated.
Port 8888
Listen 0.0.0.0
Timeout 30

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

LogLevel Warning
# No LogFile / Syslog directive: tinyproxy in foreground daemon mode
# (-d) writes log lines to the inherited stderr, which is the docker
# log stream. Setting LogFile "/dev/stderr" explicitly fails after
# setpriv drops uid (the /dev/stderr symlink resolves to the original
# root process's fd, which uid 100 cannot reopen).

MaxClients 20
# StartServers / MinSpareServers / MaxSpareServers are obsolete since
# tinyproxy 1.11 (prefork model removed; replaced by dynamic spawning).
# Alpine 3.23 ships a version that warns about them.

# Honeypot container network (docker default bridge range). If the
# `honeypot` bridge is ever pinned to a narrower subnet, tighten this.
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# HTTP CONNECT tunnels: only 80 and 443. Blocks SMTP (25/465/587),
# SMB (139/445), Telnet (23), IRC (6660-6669/6697), RDP (3389), VNC
# (5900) and any other exotic C2 channel a payload might try.
ConnectPort 443
ConnectPort 80

# Deny a handful of public relay/paste hosts frequently used as C2
# drops, in addition to the iptables-level DROP default.
Filter "/etc/egress-proxy/filter.txt"
FilterURLs On
FilterDefaultDeny Off
