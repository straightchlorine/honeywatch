# Privilege drop via setpriv in start.sh (--bounding-set=-all); User/Group here would conflict.
Port 8888
Listen 0.0.0.0
Timeout 30

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

LogLevel Warning
# Foreground daemon (-d) writes to stderr (docker log stream).
# LogFile "/dev/stderr" fails after setpriv drops uid (cannot reopen root's fd).

MaxClients 20
# StartServers/MinSpareServers/MaxSpareServers removed in tinyproxy 1.11; Alpine 3.23 warns.

# Docker default bridge range; tighten if honeypot bridge is pinned narrower.
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# HTTP CONNECT tunnels: only 80 and 443. Blocks SMTP (25/465/587),
# SMB (139/445), Telnet (23), IRC (6660-6669/6697), RDP (3389), VNC
# (5900) and any other exotic C2 channel a payload might try.
ConnectPort 443
ConnectPort 80

# Block public relay/paste hosts used as C2 drops (iptables also DROPs).
Filter "/etc/egress-proxy/filter.txt"
FilterURLs On
FilterDefaultDeny Off
