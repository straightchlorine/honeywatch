# VPS 1 (honeypot) -- production deployment
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # -- Honeypot (isolated network - no access to backend services) --
  cowrie:
    image: cowrie/cowrie:sha-cd0770d@sha256:bf371c37638bf8b49efed87b66f5d0bf48432a499c6b3fa3c44c03ebf02cc13a
    container_name: honeywatch-cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
    environment:
      http_proxy: http://egress-proxy:8888
      https_proxy: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-state:/cowrie/cowrie-git/var/lib/cowrie
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie/honeyfs/etc/passwd:/cowrie/cowrie-git/honeyfs/etc/passwd:ro
      - ./cowrie/honeyfs/etc/shadow:/cowrie/cowrie-git/honeyfs/etc/shadow:ro
      - ./cowrie/honeyfs/etc/group:/cowrie/cowrie-git/honeyfs/etc/group:ro
      - ./cowrie/honeyfs/etc/issue:/cowrie/cowrie-git/honeyfs/etc/issue:ro
      - ./cowrie/honeyfs/etc/issue.net:/cowrie/cowrie-git/honeyfs/etc/issue.net:ro
      - ./cowrie/honeyfs/etc/motd:/cowrie/cowrie-git/honeyfs/etc/motd:ro
      - ./cowrie/honeyfs/etc/os-release:/cowrie/cowrie-git/honeyfs/etc/os-release:ro
      - ./cowrie/honeyfs/etc/hostname:/cowrie/cowrie-git/honeyfs/etc/hostname:ro
      - ./cowrie/honeyfs/etc/hosts:/cowrie/cowrie-git/honeyfs/etc/hosts:ro
      - ./cowrie/honeyfs/etc/resolv.conf:/cowrie/cowrie-git/honeyfs/etc/resolv.conf:ro
      - ./cowrie/honeyfs/etc/redhat-release:/cowrie/cowrie-git/honeyfs/etc/redhat-release:ro
      - ./cowrie/honeyfs/proc/version:/cowrie/cowrie-git/honeyfs/proc/version:ro
      - ./cowrie/honeyfs/proc/cpuinfo:/cowrie/cowrie-git/honeyfs/proc/cpuinfo:ro
      - ./cowrie/honeyfs/proc/meminfo:/cowrie/cowrie-git/honeyfs/proc/meminfo:ro
      - ./cowrie/honeyfs/proc/mounts:/cowrie/cowrie-git/honeyfs/proc/mounts:ro
      - ./cowrie/honeyfs/proc/modules:/cowrie/cowrie-git/honeyfs/proc/modules:ro
    networks:
      - honeypot
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - "CMD"
        - "/cowrie/cowrie-env/bin/python3"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1',2222),timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 3

  egress-proxy:
    build: ./cowrie/egress-proxy
    container_name: honeywatch-egress-proxy
    restart: unless-stopped
    networks:
      - honeypot
      - egress
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -- Reverse proxy (binds only to the Headscale tailnet interface) --
  proxy:
    image: nginx:1.29-alpine-slim@sha256:c9366b8c560169b101ca0e5422ed063b20779e6454c2326b9c9704225c9b0c08
    container_name: honeywatch-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    ports:
      - "${TS_IP:?TS_IP must be set to the honeypot's Headscale tailnet IP}:5000:5000"
      - "${TS_IP:?TS_IP must be set to the honeypot's Headscale tailnet IP}:3000:3000"
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
      - expose
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -- Backend services (internal only - no internet access) --
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: honeywatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INGESTOR_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD must be set}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: >-
        -c password_encryption=scram-sha-256 -c log_connections=on -c log_disconnections=on -c log_statement=ddl -c shared_preload_libraries=pg_stat_statements -c shared_buffers=128MB -c work_mem=4MB -c max_connections=50 -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./postgres/init.sql:/etc/honeywatch/init.sql:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: runs Alembic migrations as the Postgres bootstrap user
  #
  # Tables are created by the role whose ALTER DEFAULT PRIVILEGES
  # init.sql configured (honeywatch_ingestor gets INSERT/SELECT,
  # honeywatch_api gets SELECT).
  #
  # Exits 0 on success; api and ingestor wait for
  # service_completed_successfully.
  api-migrate:
    image: ghcr.io/straightchlorine/honeywatch/api:${API_VERSION:?API_VERSION must be set to the released API image tag}
    container_name: honeywatch-api-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["alembic", "upgrade", "head"]

  ingestor:
    image: ghcr.io/straightchlorine/honeywatch/ingestor:${INGESTOR_VERSION:?INGESTOR_VERSION must be set to the released ingestor image tag}
    container_name: honeywatch-ingestor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cowrie:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: honeywatch_ingestor
      POSTGRES_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - cowrie-logs:/logs:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/straightchlorine/honeywatch/api:${API_VERSION:?API_VERSION must be set to the released API image tag}
    container_name: honeywatch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: honeywatch_api
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:5000/health\").getcode()==200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: honeywatch-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cowrie-logs:
  cowrie-state:
  postgres-data:
  grafana-data:

networks:
  honeypot:
    driver: bridge
    # Cowrie has no direct internet access; all egress must traverse
    # the egress-proxy sidecar which is dual-homed on `egress`.
    internal: true
  egress:
    driver: bridge
    # Only the egress-proxy sits on this bridge; it is the tinyproxy
    # container's one path to the internet.
    internal: false
  backend:
    driver: bridge
    internal: true
  expose:
    driver: bridge
    internal: false
