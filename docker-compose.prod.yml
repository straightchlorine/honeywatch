# VPS 1 (production honeypot)
# Usage: API_VERSION="$TAG" INGESTOR_VERSION="$TAG" \
#        docker compose -f docker-compose.prod.yml up -d
# $TAG such that it contains the release number for example $TAG="v0.5.7"

services:
  # -- Honeypot (isolated) --
  cowrie:
    image: cowrie/cowrie:sha-cd0770d@sha256:bf371c37638bf8b49efed87b66f5d0bf48432a499c6b3fa3c44c03ebf02cc13a
    container_name: honeywatch-cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
    environment:
      - http_proxy=http://egress-proxy:8888
      - https_proxy=http://egress-proxy:8888
      - HTTP_PROXY=http://egress-proxy:8888
      - HTTPS_PROXY=http://egress-proxy:8888
      - COWRIE_HONEYPOT_INTERNET_FACING_IP
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-state:/cowrie/cowrie-git/var/lib/cowrie
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro,Z
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro,Z
      - ./cowrie/fs/centos-stream10.pickle:/cowrie/cowrie-git/src/cowrie/data/fs.pickle:ro,Z
      - ./cowrie/cmdoutput.json:/cowrie/cowrie-git/src/cowrie/data/cmdoutput.json:ro,Z
      - ./cowrie/honeyfs:/cowrie/cowrie-git/honeyfs:ro,Z
      - ./cowrie/txtcmds:/cowrie/cowrie-git/src/cowrie/data/txtcmds:ro,Z
    networks:
      - honeypot
      - cowrie-ingress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - "CMD"
        - "/cowrie/cowrie-env/bin/python3"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1',2222),timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 3

  egress-proxy:
    build: ./cowrie/egress-proxy
    container_name: honeywatch-egress-proxy
    restart: unless-stopped
    networks:
      - honeypot
      - egress
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: iptables rule installation (start.sh) NET_RAW omitted;
      #            uses regular sockets - iptable operations don't need it
      # SETGID:    setpriv drops to tinyproxy:tinyproxy
      # SETUID:    ^
      # SETPCAP:   setpriv clears the capability bounding set
      - NET_ADMIN
      - SETGID
      - SETUID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -- Reverse proxy (binds only to the tailnet) --
  proxy:
    image: nginx:1.29-alpine-slim@sha256:c9366b8c560169b101ca0e5422ed063b20779e6454c2326b9c9704225c9b0c08
    container_name: honeywatch-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TS_IP:?TS_IP must be set to the honeypot's Headscale tailnet IP}:5000:5000"
      - "127.0.0.1:5000:5000"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./proxy/security-headers.conf:/etc/nginx/security-headers.conf:ro,Z
    networks:
      - backend
      - expose
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -- Backend services (internal only) --
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: honeywatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INGESTOR_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD must be set}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: >-
        -c password_encryption=scram-sha-256 -c log_connections=on -c log_disconnections=on -c log_statement=ddl -c shared_preload_libraries=pg_stat_statements -c shared_buffers=128MB -c work_mem=4MB -c max_connections=50 -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro,Z
      - ./postgres/init.sql:/etc/honeywatch/init.sql:ro,Z
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,Z
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # - Migration runner -
  api-migrate:
    image: ghcr.io/straightchlorine/honeywatch/api:${API_VERSION:?API_VERSION must be set}
    container_name: honeywatch-api-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["alembic", "upgrade", "head"]

  # - Ingestor service -
  ingestor:
    image: ghcr.io/straightchlorine/honeywatch/ingestor:${INGESTOR_VERSION:?INGESTOR_VERSION must be set}
    container_name: honeywatch-ingestor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cowrie:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: honeywatch_ingestor
      POSTGRES_PASSWORD: ${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - cowrie-logs:/logs:ro
      - geoip-data:/data/geoip:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # - API service -
  api:
    image: ghcr.io/straightchlorine/honeywatch/api:${API_VERSION:?API_VERSION must be set}
    container_name: honeywatch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: honeywatch_api
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:5000/health\").getcode()==200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cowrie-logs:
  cowrie-state:
  postgres-data:
  geoip-data:

networks:
  honeypot:
    driver: bridge
    # Cowrie has no direct internet access; all egress traverses through the
    # egress-proxy.
    internal: true
  egress:
    driver: bridge
    # Only the egress-proxy sits on this bridge; only path to the internet.
    internal: false
  backend:
    driver: bridge
    internal: true
  expose:
    driver: bridge
    internal: false
  cowrie-ingress:
    # Cowrie's only non-internal interface.
    #
    # Masquerade disabled: any outbound cowrie initiates leaves with an RFC1918 source and dies upstream (firewalld)
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.name: br-cowrie-ing
    ipam:
      config:
        - subnet: 172.23.0.0/24
