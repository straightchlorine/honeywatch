version: 2

updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: pip
    directory: /ingestor
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    open-pull-requests-limit: 5
    target-branch: master
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
    labels:
      - docker
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: docker
    directory: /ingestor
    schedule:
      interval: weekly
      day: monday
    labels:
      - docker
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    labels:
      - docker
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major
