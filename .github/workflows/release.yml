name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch origin master
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if git branch -r --contains "$TAG_COMMIT" | grep -q "origin/master"; then
            echo "Tag is on master"
          else
            echo "::error::tag is not on master"
            exit 1
          fi


  build-and-push:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, ingestor, dashboard]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log into GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/honeywatch-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Persist digest for attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::build produced no digest"
            exit 1
          fi
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.component }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 1

  attestation:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, ingestor, dashboard]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download digest artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.component }}
          path: digests

      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(cat "digests/${{ matrix.component }}.txt")
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::invalid digest format: $DIGEST"; exit 1 ;;
          esac
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}@${{ steps.digest.outputs.value }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Sign image (keyless via OIDC)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}@${{ steps.digest.outputs.value }}
        run: |
          cosign sign --yes "$IMAGE"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: error

  rollout:
    needs: [build-and-push, attestation]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Verify HONEYPOT_SSH_HOST_KEY is set
        env:
          HONEYPOT_SSH_HOST_KEY: ${{ secrets.HONEYPOT_SSH_HOST_KEY }}
        run: |
          if [ -z "${HONEYPOT_SSH_HOST_KEY:-}" ]; then
            echo "::error::HONEYPOT_SSH_HOST_KEY not set"
            exit 1
          fi

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: >-
            --login-server=https://vpn.codextechnologies.org --accept-dns=true
          hostname: gha-runner

      - name: Configure SSH client
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HONEYPOT_HOST: ${{ secrets.HONEYPOT_HOST }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          HONEYPOT_SSH_HOST_KEY: ${{ secrets.HONEYPOT_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_USER:-}" ];      then echo "::error::SSH_USER not set"; exit 1; fi
          if [ -z "${HONEYPOT_HOST:-}" ]; then echo "::error::HONEYPOT_HOST not set"; exit 1; fi
          if [ -z "${SSH_KEY_B64:-}" ];   then echo "::error::SSH_KEY_B64 not set"; exit 1; fi
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$HONEYPOT_HOST"
          echo "::add-mask::$SSH_KEY_B64"

          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/key
          printf '%s\n' "$HONEYPOT_SSH_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host honeypot
            HostName ${HONEYPOT_HOST}
            User ${SSH_USER}
            Port 2022
            AddressFamily inet
            IdentityFile ~/.ssh/key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 60
            ServerAliveCountMax 3
            KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
            HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256
            MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
          EOF
          chmod 600 ~/.ssh/key ~/.ssh/known_hosts ~/.ssh/config

      - name: Roll out to honeypot over tailnet
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          ssh -F ~/.ssh/config honeypot "
            set -e
            cd /opt/honeywatch
            export API_VERSION='${TAG}' INGESTOR_VERSION='${TAG}'
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      - name: Install cosign for post-rollout verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Verify rolled-out image signatures
        env:
          REPO: ${{ github.repository }}
          IDENTITY_REGEX: 'https://github.com/${{ github.repository }}/.+'
          OIDC_ISSUER: 'https://token.actions.githubusercontent.com'
        run: |
          set -euo pipefail
          for component in api ingestor dashboard; do
            DIGEST=$(cat "digests/${component}.txt")
            IMAGE="${{ env.IMAGE_PREFIX }}/${component}@${DIGEST}"
            echo "Verifying ${IMAGE}"
            cosign verify "${IMAGE}" \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" >/dev/null
          done

  release:
    needs: [rollout]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
