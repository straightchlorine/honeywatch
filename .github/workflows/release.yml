name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch origin master
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if git branch -r --contains "$TAG_COMMIT" | grep -q "origin/master"; then
            echo "Tag is on master"
          else
            echo "Tag is NOT on master"
            exit 1
          fi


  build-and-push:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, ingestor, dashboard]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: >-
            --login-server=https://vpn.codextechnologies.org --accept-dns=true
          hostname: gha-runner

      - name: Deploy to honeypot over tailnet
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HONEYPOT_HOST: ${{ secrets.HONEYPOT_HOST }}
          HONEYPOT_SSH_HOST_KEY: ${{ secrets.HONEYPOT_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SSH_USER:-}" ]; then echo "::add-mask::$SSH_USER"; fi
          if [ -n "${HONEYPOT_HOST:-}" ]; then echo "::add-mask::$HONEYPOT_HOST"; fi
          if [ -n "${SSH_KEY:-}" ]; then echo "::add-mask::$SSH_KEY"; fi
          if [ -n "${SSH_KEY_B64:-}" ]; then echo "::add-mask::$SSH_KEY_B64"; fi

          umask 077
          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS="$(mktemp)"
          trap 'shred -u "$KEY_FILE" "$KNOWN_HOSTS" 2>/dev/null || rm -f "$KEY_FILE" "$KNOWN_HOSTS"' EXIT

          if [ -n "${SSH_KEY_B64:-}" ]; then
            printf '%s' "$SSH_KEY_B64" | base64 -d > "$KEY_FILE"
          elif [ -n "${SSH_KEY:-}" ]; then
            echo "::warning::Using legacy SSH_KEY secret. Rotate to SSH_KEY_B64 (base64-encoded) to avoid CR/LF normalization issues."
            printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          else
            echo "Neither SSH_KEY_B64 nor SSH_KEY secret is set." >&2
            exit 1
          fi
          chmod 600 "$KEY_FILE"

          STRICT_HOST_OPT="-o StrictHostKeyChecking=yes"
          if [ -n "${HONEYPOT_SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$HONEYPOT_SSH_HOST_KEY" > "$KNOWN_HOSTS"
          else
            echo "::warning::HONEYPOT_SSH_HOST_KEY secret is not set; falling back to StrictHostKeyChecking=accept-new (TOFU). TODO: set HONEYPOT_SSH_HOST_KEY to a pinned known_hosts line to eliminate the first-use MITM window."
            STRICT_HOST_OPT="-o StrictHostKeyChecking=accept-new"
          fi

          TAG="${GITHUB_REF_NAME#v}"
          ssh -p 2022 \
              -i "$KEY_FILE" \
              -o UserKnownHostsFile="$KNOWN_HOSTS" \
              $STRICT_HOST_OPT \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${SSH_USER}@${HONEYPOT_HOST}" \
              "set -e; cd /opt/honeywatch && export API_VERSION='${TAG}' INGESTOR_VERSION='${TAG}' && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans"

  release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
