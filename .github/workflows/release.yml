name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch origin master
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if git branch -r --contains "$TAG_COMMIT" | grep -q "origin/master"; then
            echo "Tag is on master"
          else
            echo "Tag is NOT on master"
            exit 1
          fi

  build-and-push:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, ingestor, dashboard]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Join the Headscale tailnet ephemerally. The ACL restricts this runner
      # (tag:cicd) to SSH-only into the honeypot. No public jumphost, no
      # public SSH on the honeypot itself.
      #
      # Note: the preauth key stored in TS_AUTHKEY must be minted with
      # `--tags tag:cicd`. We deliberately do NOT pass `--advertise-tags`
      # here -- headscale 0.28 rejects registrations that combine a tagged
      # preauth key with a matching `--advertise-tags` on the client. The
      # tag is applied server-side from the key.
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: >-
            --login-server=https://vpn.codextechnologies.org
            --accept-dns=true
          hostname: gha-runner

      - name: Deploy to honeypot over tailnet
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HONEYPOT_HOST: ${{ secrets.HONEYPOT_HOST }}   # tailnet name or IP of the honeypot
        run: |
          install -m 600 /dev/null ~/.ssh_deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh_deploy_key
          ssh -i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HONEYPOT_HOST}" \
            'cd /opt/honeywatch && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans'
          rm -f ~/.ssh_deploy_key

  release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
