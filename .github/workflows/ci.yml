name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        component: [api, ingestor]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: honeywatch
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: honeywatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck with pyright
        run: uv run pyright

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://honeywatch:testpass@localhost:5432/honeywatch_test
        run: uv run pytest

      - name: Set up pnpm
        if: matrix.component == 'api'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node.js
        if: matrix.component == 'api'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: OpenAPI drift gate
        if: matrix.component == 'api'
        working-directory: ${{ github.workspace }}
        env:
          FLASK_APP: src.app:create_app
          FLASK_SECRET_KEY: openapi-dump
          ENVIRONMENT: development
        run: |
          cd api && uv run flask openapi-dump --output openapi.json
          cd ../dashboard && pnpm install --frozen-lockfile && pnpm openapi:gen
          cd ..
          git add -A -- api/openapi.json dashboard/src/api/generated
          git diff --cached --exit-code -- api/openapi.json dashboard/src/api/generated

  spec-lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: 'api/openapi.json'
          spectral_ruleset: '.spectral.yaml'

  dashboard:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests (vitest + coverage gate)
        run: pnpm test --coverage

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright + axe)
        run: pnpm e2e

  image-scan:
    name: image-scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, ingestor, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ matrix.component }}:scan
          no-cache: true
          pull: true

      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.component }}:scan
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.component }}:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
