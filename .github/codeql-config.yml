name: CodeQL Configuration

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: py/unsafe-cyclic-import

paths:
  - api
  - ingestor
  - dashboard/src

paths-ignore:
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/tests/"
  - "**/node_modules/"
  - "grafana/"
  - "cowrie/"
  - "db/"
