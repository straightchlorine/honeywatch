[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywatch-ingestor"
version = "v0.6.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.4,<4",
    "psycopg-pool>=3.3.1,<4",
    "pydantic>=2.13.4,<3",
    "geoip2>=5.2.0,<6",
    "maxminddb>=3.1.1,<4",
    "prometheus-client>=0.25.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["build", "**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
