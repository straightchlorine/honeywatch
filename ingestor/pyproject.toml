[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywatch-ingestor"
version = "v0.8.2"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6,<4",
    "psycopg-pool>=3.3.3,<4",
    "pydantic>=2.14.1,<3",
    "geoip2>=5.3.0,<6",
    "maxminddb>=3.2.0,<4",
    "prometheus-client>=0.26.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "pyright>=1.1.414",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["build", "**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
