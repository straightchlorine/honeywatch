[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywatch-ingestor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.3,<4",
    "psycopg-pool>=3.3.0,<4",
    "pydantic>=2.13.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9",
    "pyright>=1.1.408",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["build", "**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
