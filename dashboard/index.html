    <!-- prettier-ignore -->
    <style>
    /* Loading splash, shown from the first paint until the app has rendered. Plain CSS because the CSP forbids
       inline script; src/utils/splash.ts decides when it leaves. Colours are copied from src/assets/tokens.css.
       The wordmark is the TopBar's "Honeywatch" (Bricolage Grotesque 700) converted to an SVG path, so it needs
       no web font; regenerate the path if the TopBar lettering changes. */
    html{background:#120d09}  /* same dark as --bg-0, set here so it does not depend on the app stylesheet */
    #hw-splash{
      --hw-bg:#120d09;--hw-ac:#f59e0b;--hw-dim:#b45309;--hw-tx:#f5e6c8;--hw-mu:#b59c75;
      --m:88px;                                     /* logo width; its height is 1.1 times this, like HexIcon */
      --R:max(50vh + 28.87vw, 57.74vw);             /* radius (centre to corner) of a point-up hexagon that covers the whole viewport */
      position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden;
      animation:hw-failsafe 400ms linear 12s forwards;  /* if the app never asks the splash to leave, it fades out by itself after 12s */
    }
    vite-error-overlay{z-index:2147483001}  /* only exists on Vite's dev server: keep its error overlay above the splash, or a startup error hides behind it for 12s */
    @supports (height:1lvh){#hw-splash{--R:max(50lvh + 28.87vw, 57.74vw)}}  /* lvh = height with phone toolbars hidden, so the hexagon still covers the screen when they slide away */
    @media (max-width:640px){#hw-splash{--m:64px}}
    #hw-splash>*,.hw-fg>*{position:absolute}
    .hw-fg{inset:0}
    .hw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    /* .hw-cover is the dark sheet over the page. On exit a hexagonal hole opens in it, growing from radius --i0 to
       --i1 (hw-x-iris). .hw-amber sits underneath with a slightly smaller hole, which shows as a thin amber rim. */
    .hw-cover{inset:0;background:var(--hw-bg) radial-gradient(circle 45vmin at 50% 50%,rgba(245,158,11,.07),rgba(245,158,11,0));  /* fixed radius: a round glow, not an oval, on tall phones */
      --i0:6px;--i1:calc(var(--R)*1.14 + 10.3px)}
    .hw-amber{inset:0;background:var(--hw-ac);opacity:0;display:none;--i0:0px;--i1:calc(var(--R)*1.14 + 8px)}
    /* Logo, centred with negative margins rather than a transform, because its scale-in animation sets transform. */
    .hw-mark{left:50%;top:50%;width:var(--m);height:calc(var(--m)*1.1);margin:calc(var(--m)*-.55) 0 0 calc(var(--m)*-.5);
      animation:hw-in 480ms cubic-bezier(.2,.7,.2,1) 160ms both}
    .hw-mark>*{position:absolute}
    .hw-glow{left:calc(var(--m)*-1.5);top:calc(var(--m)*-1.45);width:calc(var(--m)*4);height:calc(var(--m)*4)}
    .hw-glow i{display:block;width:100%;height:100%;background:radial-gradient(closest-side,rgba(245,158,11,.16),rgba(245,158,11,0))}
    /* A larger, dimmer hexagon behind the logo that turns the opposite way, a moment later. */
    .hw-echo{left:-50%;top:-50%;width:200%;height:200%;opacity:.5}
    .hw-ol,.hw-dot{inset:0}
    .hw-svg{display:block;width:100%;height:100%;overflow:visible}
    .hw-svg polygon{fill:none;stroke:var(--hw-ac);stroke-width:1.6}
    .hw-echo .hw-svg polygon{stroke:var(--hw-dim);stroke-width:1px;vector-effect:non-scaling-stroke}
    .hw-dot i{position:absolute;left:34%;top:calc(50% - var(--m)*.16);width:32%;height:calc(var(--m)*.32);border-radius:50%;background:var(--hw-ac)}
    /* Caption: the wordmark, then the hint that appears after 5s if loading is slow. */
    .hw-cap{left:0;right:0;top:calc(50% + var(--m)*.55 + 24px);text-align:center;animation:hw-in 500ms ease 320ms both}
    .hw-wm{display:block;margin:0 auto;width:130px;height:29px;fill:var(--hw-tx)}
    .hw-hint{display:block;margin-top:16px;font:500 14px/1.35 'Bricolage Grotesque Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em;
      color:var(--hw-mu);animation:hw-hint-in 900ms ease 5s both}
    @media (max-width:640px){.hw-wm{width:108px;height:24px}}
    /* Fade-ins for the logo (hw-in-s adds a slight scale-up when motion is allowed), caption and hint, and the 12s
       failsafe fade-out. */
    @keyframes hw-in{from{opacity:0}to{opacity:1}}
    @keyframes hw-in-s{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
    @keyframes hw-hint-in{from{opacity:0;visibility:hidden}to{opacity:1}}  /* visibility, not just opacity, so screen readers do not announce the hint before it shows */
    @keyframes hw-failsafe{to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:no-preference){
      /* The logo turns 60deg in a quick step with a slight overshoot, then holds. The loop restarts at 0deg, which looks
         identical because a hexagon repeats every 60deg. With reduced motion nothing turns or scales. */
      .hw-mark{animation-name:hw-in-s}
      .hw-ol .hw-svg{animation:hw-turn 1400ms linear 380ms infinite}
      .hw-echo .hw-svg{animation:hw-turn-b 1400ms linear 380ms infinite}
      .hw-dot i{animation:hw-tick 1400ms linear 380ms infinite}
      .hw-glow i{animation:hw-breathe 1400ms linear 380ms infinite}
    }
    @keyframes hw-turn{
      0%{transform:rotate(0);animation-timing-function:cubic-bezier(.62,0,.22,1)}
      34%{transform:rotate(62.5deg);animation-timing-function:cubic-bezier(.3,0,.3,1)}
      46%,100%{transform:rotate(60deg)}}
    @keyframes hw-turn-b{
      0%,7%{transform:rotate(0);animation-timing-function:cubic-bezier(.62,0,.22,1)}
      41%{transform:rotate(-61.5deg);animation-timing-function:cubic-bezier(.3,0,.3,1)}
      53%,100%{transform:rotate(-60deg)}}
    @keyframes hw-tick{
      0%{transform:scale(1);animation-timing-function:ease-in}
      22%{transform:scale(.8);animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}
      35%{transform:scale(1.17);animation-timing-function:ease-out}
      50%,100%{transform:scale(1)}}
    @keyframes hw-breathe{0%,100%{opacity:.5}35%{opacity:1}60%{opacity:.6}}

    /* ---- EXIT: src/utils/splash.ts sets data-state="exit" once the app has rendered, plus data-fast if the splash was
       visible for under 500ms. Slow loads end with the hexagon reveal: a hexagonal hole opens from the logo and grows
       past the screen corners, uncovering the page. A slow page change replays it on a copy (revealPage). ---- */
    /* Default exit is a plain fade: fast loads, reduced motion, and browsers that cannot clip to the hexagon shape. */
    #hw-splash[data-state=exit]{animation:hw-x-gone 240ms linear forwards}
    #hw-splash[data-state=exit] .hw-fg{animation:hw-x-fade 110ms ease-out forwards}
    #hw-splash[data-state=exit] .hw-cover{animation:hw-x-fade 240ms ease-out forwards}
    #hw-splash[data-fast] .hw-fg{animation-duration:60ms}   /* on a fast exit the logo has barely faded in, so fade it out quickly too rather than leave a faint logo */
    @media (prefers-reduced-motion:no-preference){
     @supports (clip-path:polygon(evenodd,0 0,9px 0,9px 9px)){
      #hw-splash[data-state=exit]:not([data-fast]){animation:hw-x-gone 560ms linear forwards}
      /* The hole starts 72ms into the exit, when the centre dot has faded out completely (hw-x-dot is transparent at
         55% of its 130ms). It has a delay and no backwards fill, so no hole exists before then: one opening under the
         half-visible dot looks like a glitch. It grows to 1.14x the radius that just covers the screen, so its sides leave the screen quickly
         instead of creeping off the edges. 72ms + 488ms matches the 560ms of hw-x-gone above. */
      #hw-splash[data-state=exit]:not([data-fast]) .hw-amber{display:block;
        animation:hw-x-iris 488ms cubic-bezier(.5,0,.5,.75) 72ms forwards,hw-x-ring 488ms linear 72ms forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-cover{animation:hw-x-iris 488ms cubic-bezier(.5,0,.5,.75) 72ms forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-ol{animation:hw-x-out 220ms cubic-bezier(.2,.7,.2,1) forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-echo{animation:hw-x-fade 160ms ease-out forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-dot{animation:hw-x-dot 130ms cubic-bezier(.2,.7,.2,1) forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-fg{animation:none}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-glow{animation:hw-x-fade 200ms ease-out forwards}
      #hw-splash[data-state=exit]:not([data-fast]) .hw-cap{animation:hw-x-fade 150ms ease-out forwards}
     }
    }
    /* src/assets/tokens.css cuts every animation to 0.01ms (with !important) for users who prefer reduced motion. A fade
       is not motion, so these more specific !important rules restore the fade durations; nothing here moves or scales. */
    @media (prefers-reduced-motion:reduce){
      .hw-mark{animation-duration:480ms!important}
      .hw-cap{animation-duration:500ms!important}
      .hw-hint{animation-duration:900ms!important}
      #hw-splash:not([data-state]){animation-duration:400ms!important}
      #hw-splash[data-state=exit],#hw-splash[data-state=exit] .hw-cover{animation-duration:240ms!important}
      #hw-splash[data-state=exit] .hw-fg{animation-duration:110ms!important}
      #hw-splash[data-fast] .hw-fg{animation-duration:60ms!important}
    }
    @keyframes hw-x-fade{to{opacity:0}}
    @keyframes hw-x-gone{to{visibility:hidden}}
    @keyframes hw-x-out{to{opacity:0;transform:scale(1.14)}}
    @keyframes hw-x-dot{25%{opacity:1;transform:scale(1.2);animation-timing-function:linear}55%,to{opacity:0;transform:scale(1.5)}}
    @keyframes hw-x-ring{0%{opacity:0}10%{opacity:1}70%{opacity:.9}100%{opacity:0}}
    @keyframes hw-x-iris{
      from{clip-path:polygon(evenodd,-50px -50px,calc(100% + 50px) -50px,calc(100% + 50px) calc(100% + 50px),-50px calc(100% + 50px),-50px -50px,calc(50% + var(--i0)*.866) calc(50% - var(--i0)*.5),calc(50% + var(--i0)*.866) calc(50% + var(--i0)*.5),50% calc(50% + var(--i0)),calc(50% - var(--i0)*.866) calc(50% + var(--i0)*.5),calc(50% - var(--i0)*.866) calc(50% - var(--i0)*.5),50% calc(50% - var(--i0)),calc(50% + var(--i0)*.866) calc(50% - var(--i0)*.5))}
      to{clip-path:polygon(evenodd,-50px -50px,calc(100% + 50px) -50px,calc(100% + 50px) calc(100% + 50px),-50px calc(100% + 50px),-50px -50px,calc(50% + var(--i1)*.866) calc(50% - var(--i1)*.5),calc(50% + var(--i1)*.866) calc(50% + var(--i1)*.5),50% calc(50% + var(--i1)),calc(50% - var(--i1)*.866) calc(50% + var(--i1)*.5),calc(50% - var(--i1)*.866) calc(50% - var(--i1)*.5),50% calc(50% - var(--i1)),calc(50% + var(--i1)*.866) calc(50% - var(--i1)*.5))}}
    </style>
