server_tokens off;

# The map geometry is a ~950 KB JSON blob fetched on every cold Overview load,
# and nginx:alpine ships with gzip commented out. Without this it goes over the
# wire uncompressed; with it, ~310 KB.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/json application/javascript text/css image/svg+xml application/xml;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Since nginx drops all inherited add_headers - including them here.
    include /etc/nginx/security-headers.conf;

    # Proxy /api to api:5000 (dev only; in k8s, Traefik routes /api before this pod).
    # Resolver + variable upstream prevents startup failure if api hostname doesn't exist.
    resolver 127.0.0.11 ipv6=off valid=30s;
    location /api/ {
        set $upstream_api http://api:5000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Prerendered pages serve in-place to preserve canonical URLs.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Map geometry: worth caching (it is ~950 KB and changes rarely) but NOT
    # immutable - the filename carries no content hash, so a border correction
    # must be able to reach clients. 7d then revalidate.
    location /geo/ {
        expires 7d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Assets cached 30d; index.html stays fresh for deploy detection.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
