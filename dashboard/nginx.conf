server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Since nginx drops all inherited add_headers - including them here.
    include /etc/nginx/security-headers.conf;

    # Dev-only: proxy /api to api:5000. In k8s, Traefik routes /api before reaching this pod.
    # Resolver + variable upstream prevents startup failure if api hostname doesn't exist.
    resolver 127.0.0.11 ipv6=off valid=30s;
    location /api/ {
        set $upstream_api http://api:5000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Route resolution: real file ($uri) > prerendered route ($uri.html) > SPA shell (index.html).
    # Prerendered pages serve in-place so URLs stay canonical.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Assets cached 30d; index.html stays fresh for deploy detection.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
