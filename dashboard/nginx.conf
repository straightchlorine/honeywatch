server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Since nginx drops all inherited add_headers - including them here.
    include /etc/nginx/security-headers.conf;

    # Dev-only: proxy /api to the api compose service so `docker compose up`
    # gives a working end-to-end stack. In k8s, Traefik routes /api before
    # traffic ever reaches this pod, so this block is unreachable there.
    # resolver + variable upstream keeps nginx from failing to start when
    # the `api` hostname doesn't exist (e.g. in a k8s cluster).
    resolver 127.0.0.11 ipv6=off valid=30s;
    location /api/ {
        set $upstream_api http://api:5000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Route resolution: a real file ($uri) wins first (robots.txt, sitemap.xml,
    # assets); then the build-time prerendered per-route page ($uri.html, e.g.
    # /activity -> /activity.html) served in place with no trailing-slash
    # redirect so the URL stays canonical; otherwise the SPA shell (index.html)
    # lets Vue Router handle client-side routing.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Static assets get aggressive caching; index.html stays fresh so
    # new deploys are picked up on next load.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
