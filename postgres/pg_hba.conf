# If you change POSTGRES_USER or POSTGRES_DB in .env, you MUST also edit
# this file to match - every connection from the docker bridge will
# otherwise be rejected.

# Local socket: trust so the postgres entrypoint init scripts (running
# as the superuser inside the container) can bootstrap roles and tables.
local   all             all                                      trust

# Per-app roles, container bridge net, scram-sha-256 password auth.
host    honeywatch      honeywatch_ingestor   172.16.0.0/12      scram-sha-256
host    honeywatch      honeywatch_api        172.16.0.0/12      scram-sha-256

# Bootstrap superuser (POSTGRES_USER, default "honeywatch") -- limited to
# the same internal CIDR so backups and ad-hoc admin connections work.
host    honeywatch      honeywatch            172.16.0.0/12      scram-sha-256

host    all             all                   0.0.0.0/0          reject
host    all             all                   ::/0               reject
