worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout combined;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security defaults
    server_tokens off;
    client_max_body_size 8k;
    client_body_buffer_size 4k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;

    # Timeouts (slowloris mitigation)
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    server {
        listen 5000;
        limit_req zone=api burst=10 nodelay;
        limit_conn perip 20;

        # Method allowlist: read-only API accepts GET/HEAD/OPTIONS only.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        location / {
            set $upstream_api http://api:5000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    server {
        listen 3000;
        limit_req zone=dashboard burst=20 nodelay;
        limit_conn perip 20;

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        location / {
            set $upstream_grafana http://grafana:3000;
            proxy_pass $upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
