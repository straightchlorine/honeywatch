worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout combined;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security defaults
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server-Timing;
    client_max_body_size 8k;
    client_body_buffer_size 4k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Timeouts (slowloris mitigation)
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=docs:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # JSON error pages matching flask-smorest Error envelope
    # ({code,status,message}). Same shape whether failure originates
    # at nginx (unmapped path, upstream 5xx) or Flask (smorest abort).
    error_page 404 = @json404;
    error_page 405 = @json405;
    error_page 429 = @json429;
    error_page 500 502 503 504 = @json5xx;

    # Security headers (apply via 'always' so they hit error responses too).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Default CSP: strict, suitable for the JSON API and the SPA.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    server {
        listen 5000;
        limit_req zone=api burst=10 nodelay;
        limit_conn perip 20;

        # Method allowlist: read-only API accepts GET/HEAD/OPTIONS only.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        location = /health {
            limit_req zone=health burst=50 nodelay;
            set $upstream_api_health http://api:5000;
            proxy_pass $upstream_api_health/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /api/v1/openapi.json {
            limit_req zone=docs burst=5 nodelay;
            set $upstream_api_openapi http://api:5000;
            proxy_pass $upstream_api_openapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /swagger {
            return 302 /api/v1/swagger;
        }

        location = /redoc {
            return 302 /api/v1/redoc;
        }

        # Swagger UI + ReDoc bootstrap pages.
        location /api/v1/swagger {
            limit_req zone=docs burst=5 nodelay;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            set $upstream_api_swagger http://api:5000;
            proxy_pass $upstream_api_swagger;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/v1/redoc {
            limit_req zone=docs burst=5 nodelay;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            set $upstream_api_redoc http://api:5000;
            proxy_pass $upstream_api_redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Vendored UI assets.
        location /static/swagger-ui/ {
            limit_req zone=docs burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
            set $upstream_api_swagger_static http://api:5000;
            proxy_pass $upstream_api_swagger_static;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /static/redoc/ {
            limit_req zone=docs burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
            set $upstream_api_redoc_static http://api:5000;
            proxy_pass $upstream_api_redoc_static;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            set $upstream_api http://api:5000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location @json404 { default_type application/json; return 404 '{"code":404,"status":"Not Found","message":"Not Found"}'; }
        location @json405 { default_type application/json; return 405 '{"code":405,"status":"Method Not Allowed","message":"Method Not Allowed"}'; }
        location @json429 { default_type application/json; return 429 '{"code":429,"status":"Too Many Requests","message":"Too Many Requests"}'; }
        location @json5xx { default_type application/json; return 500 '{"code":500,"status":"Internal Server Error","message":"Internal Server Error"}'; }
    }

    server {
        listen 3000;
        limit_req zone=dashboard burst=20 nodelay;
        limit_conn perip 20;

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        location / {
            set $upstream_grafana http://grafana:3000;
            proxy_pass $upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location @json404 { default_type application/json; return 404 '{"code":404,"status":"Not Found","message":"Not Found"}'; }
        location @json405 { default_type application/json; return 405 '{"code":405,"status":"Method Not Allowed","message":"Method Not Allowed"}'; }
        location @json5xx { default_type application/json; return 500 '{"code":500,"status":"Internal Server Error","message":"Internal Server Error"}'; }
    }
}
